<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-title" content="每日日文">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>每日日文</title>
<style>
  :root{
    --bg:#0b0d12; --s1:#161921; --s2:#1f232c; --line:#272b35;
    --ink:#eef0f4; --sub:#8b919c; --dim:#5d636e;
    --blue:#4a7dff; --flame:#ff8a3d; --red:#ff5a5f; --green:#3ecf8e; --amber:#f5b942;
    --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:440px;min-height:100dvh;position:relative}
  .hidden{display:none!important}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  svg{display:block}

  .page{padding:calc(18px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}
  .ptitle{font-size:28px;font-weight:700;margin:6px 0 18px}
  .sec{font-size:15px;font-weight:600;margin:22px 0 10px}
  .card{background:var(--s1);border-radius:16px}

  /* top bar */
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .date{font-size:13px;color:var(--sub)}
  .pill{display:flex;align-items:center;gap:5px;background:var(--s1);border-radius:999px;padding:6px 12px 6px 9px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill svg{width:16px;height:16px}
  .pill.cold{color:var(--sub)}

  /* week */
  .week{display:flex;justify-content:space-between;padding:14px 14px 12px;margin-top:4px}
  .day{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--sub)}
  .dot{width:28px;height:28px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
  .dot.on{background:var(--flame)}
  .dot.on svg{width:14px;height:14px}
  .dot.today{box-shadow:inset 0 0 0 1.5px var(--flame)}

  /* task */
  .task{padding:18px}
  .task .lbl{font-size:12px;color:var(--sub);letter-spacing:.05em}
  .task h2{font-size:20px;font-weight:700;margin:4px 0 16px}
  .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .count{background:var(--s2);border-radius:12px;padding:12px 8px;text-align:center}
  .count b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .count span{font-size:12px;color:var(--sub)}
  .count.rev b{color:var(--amber)} .count.nw b{color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;max-height:96px;overflow:hidden}
  .chip{font-family:var(--jp);font-size:13px;line-height:20px;padding:5px 10px;border-radius:999px;background:var(--s2);color:#cfd3da;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.new{background:rgba(74,125,255,.15);color:#8eaeff}
  .btn{width:100%;padding:15px;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:600}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4}
  .btn2{width:100%;padding:13px;border-radius:14px;background:var(--s2);font-size:14px;color:#cfd3da;margin-top:10px}
  .donebox{text-align:center;padding:6px 0 14px}
  .donebox .ck{width:52px;height:52px;border-radius:50%;background:rgba(62,207,142,.15);color:var(--green);display:grid;place-items:center;margin:0 auto 10px;font-size:26px}
  .donebox p{color:var(--sub);font-size:14px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:14px}
  .stat b{font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{display:block;font-size:12px;color:var(--sub);margin-top:2px}

  /* library */
  .seg{display:flex;background:var(--s1);border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;padding:9px;border-radius:9px;font-size:14px;color:var(--sub)}
  .seg button.on{background:var(--s2);color:var(--ink);font-weight:600}
  .list{overflow:hidden}
  .row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .st{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
  .st.l{background:var(--blue)} .st.m{background:var(--green)}
  .rmain{flex:1;min-width:0}
  .rjp{font-family:var(--jp);font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
  .rzh{font-size:12px;color:var(--sub);margin-top:3px}
  .spk{color:var(--sub);padding:2px}
  .spk svg{width:15px;height:15px}
  .bm{color:var(--blue);padding:4px}
  .bm svg{width:18px;height:18px}
  .empty{padding:34px 14px;text-align:center;color:var(--sub);font-size:14px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin:-4px 2px 12px}
  .legend span{display:flex;align-items:center;gap:6px}

  /* practice */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px;text-align:left;display:flex;flex-direction:column;gap:14px}
  .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--jp);font-weight:700;color:#fff;font-size:17px}
  .tile b{font-size:15px}
  .tile span{font-size:12px;color:var(--sub);font-weight:400;display:block;margin-top:2px}
  .prow{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;margin-bottom:10px}
  .prow .ci{width:38px;height:38px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
  .prow .ci svg{width:18px;height:18px}
  .prow b{font-size:15px;display:block}
  .prow span{font-size:12px;color:var(--sub)}
  .prow .n{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .prow:disabled{opacity:.45}

  /* nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:8px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(11,13,18,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:5}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);padding:6px 0}
  .nav button svg{width:22px;height:22px}
  .nav button.on{color:var(--ink)}
  .nav button.on .nb{background:var(--s2)}
  .nb{padding:4px 16px;border-radius:999px}

  /* study */
  .study{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;justify-content:center}
  .sin{width:100%;max-width:440px;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
  .shead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .x{width:34px;height:34px;border-radius:50%;background:var(--s1);display:grid;place-items:center;color:var(--sub);flex:none}
  .x svg{width:16px;height:16px}
  .prog{flex:1;height:6px;background:var(--s1);border-radius:3px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
  .left{font-size:13px;color:var(--sub);min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
  .flash{flex:1;background:var(--s1);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;min-height:320px;cursor:pointer}
  .tag{position:absolute;top:16px;left:18px;font-size:12px;color:var(--sub);background:var(--s2);padding:4px 9px;border-radius:999px}
  .tag.new{color:#8eaeff;background:rgba(74,125,255,.15)}
  .ftools{position:absolute;top:10px;right:10px;display:flex;gap:2px}
  .ftools button{padding:8px;color:var(--sub)}
  .ftools button svg{width:19px;height:19px}
  .ftools .bm{color:var(--blue)}
  .jp{font-family:var(--jp);font-size:42px;font-weight:600;line-height:1.35}
  .jp.long{font-size:24px;line-height:1.55}
  .ans{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);width:100%}
  .kana{font-family:var(--jp);font-size:17px;color:#aab0bb}
  .zh{font-size:20px;margin-top:10px;font-weight:600}
  .flash{cursor:default;min-height:230px}
  .qlabel{font-size:13px;color:var(--sub);margin-bottom:12px}
  .zhq{font-size:24px;font-weight:700;line-height:1.5}
  .verdict{margin-top:16px;font-size:14px;font-weight:600}
  .verdict.ok{color:var(--green)} .verdict.ng{color:var(--red)}
  .verdict small{display:block;font-weight:400;color:var(--sub);margin-top:4px;font-family:var(--jp)}
  .actions{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opts.one{grid-template-columns:1fr}
  .opt{padding:14px 12px;border-radius:14px;background:var(--s1);font-size:15px;text-align:center;border:1.5px solid transparent;line-height:1.4}
  .opts.one .opt{text-align:left;font-family:var(--jp);font-size:15px}
  .opt:active{transform:scale(.98)}
  .opt.right{border-color:var(--green);background:rgba(62,207,142,.12);color:var(--green)}
  .opt.wrong{border-color:var(--red);background:rgba(255,90,95,.12);color:var(--red)}
  .opt:disabled{cursor:default}
  .inp{width:100%;padding:15px 16px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);color:var(--ink);font-size:18px;font-family:var(--jp);outline:none}
  .inp:focus{border-color:var(--blue)}
  .pv{font-family:var(--jp);font-size:14px;color:var(--sub);min-height:20px;padding:0 4px}
  .two{display:grid;grid-template-columns:1fr 2fr;gap:8px}
  .two .btn2{margin:0}
  .row[data-id]{cursor:pointer}
  .row[data-id]:active{background:var(--s2)}
  .chev{color:var(--dim);font-size:18px;margin-left:-4px}
  mark{background:none;color:var(--flame);font-weight:700}
  .fex{margin-top:16px;padding:12px 14px;background:var(--s2);border-radius:12px;text-align:left}
  .fex .exjp{font-family:var(--jp);font-size:15px;line-height:1.6}
  .fex .exzh{font-size:12px;color:var(--sub);margin-top:3px}
  .sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .sbg{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
  .spanel{position:relative;width:100%;max-width:440px;background:var(--s1);border-radius:22px 22px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-height:85dvh;overflow:auto}
  @keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes fade{from{opacity:0}}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
  .dtop{display:flex;align-items:flex-start;gap:10px}
  .djp{font-family:var(--jp);font-size:34px;font-weight:700;line-height:1.3;flex:1}
  .djp.long{font-size:22px}
  .dkana{font-family:var(--jp);color:#aab0bb;font-size:16px;margin-top:4px}
  .dtools{display:flex;gap:2px}
  .dtools button,.exsay{padding:8px;color:var(--sub)}
  .dtools svg,.exsay svg{width:20px;height:20px}
  .dtools .bm{color:var(--blue)}
  .dzh{font-size:19px;font-weight:600;margin-top:10px}
  .dlbl{font-size:12px;color:var(--sub);letter-spacing:.06em;margin:22px 0 8px}
  .dex{background:var(--s2);border-radius:14px;padding:14px 10px 14px 16px;display:flex;gap:6px;align-items:flex-start}
  .dex .exjp{font-family:var(--jp);font-size:17px;line-height:1.65;flex:1}
  .dex .exzh{font-size:13px;color:var(--sub);margin-top:6px}
  .exsay{flex:none;margin-top:-2px}
  .dst{font-size:12px;color:var(--dim);margin-top:18px}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--s2);color:var(--ink);font-size:13px;padding:10px 14px;border-radius:12px;max-width:340px;text-align:center;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.4)}

  .finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .finish .flame svg{width:72px;height:72px}
  .finish .num{font-size:52px;font-weight:800;color:var(--flame);line-height:1.1;font-variant-numeric:tabular-nums}
  .finish h3{font-family:var(--jp);font-size:24px;margin-top:14px}
  .finish p{color:var(--sub)}
  .foot{margin-top:26px;text-align:center}
  .foot button{font-size:12px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 今日 ===== -->
  <section class="page" id="pg-today">
    <div class="topbar">
      <div class="date" id="date"></div>
      <div class="pill" id="pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5.3 1.6 1.2 2.6 2.2 2.6C10.5 7.5 11 4.5 12 2z"/></svg><span id="streak">0</span></div>
    </div>
    <div class="ptitle" id="hello">今日</div>

    <div class="card week" id="week"></div>

    <div class="card task" style="margin-top:12px">
      <div class="lbl">今日任務</div>
      <div id="todo">
        <h2 id="taskTitle">開始今天的學習</h2>
        <div class="counts">
          <div class="count rev"><b id="cRev">0</b><span>要複習</span></div>
          <div class="count nw"><b id="cWord">0</b><span>新單字</span></div>
          <div class="count nw"><b id="cPhrase">0</b><span>新會話</span></div>
        </div>
        <div class="chips" id="chips"></div>
        <button class="btn" id="start">開始</button>
      </div>
      <div id="doneBox" class="hidden">
        <h2>今天完成了</h2>
        <div class="donebox"><div class="ck">✓</div><p>連勝已記錄，明天見！</p></div>
        <button class="btn2" id="more">再多學 5 個新內容</button>
      </div>
    </div>

    <div class="sec">進度</div>
    <div class="stats">
      <div class="card stat"><b id="sLearn">0</b><span>已學</span></div>
      <div class="card stat"><b id="sMaster">0</b><span>已熟練</span></div>
      <div class="card stat"><b id="sTotal">0</b><span>總數</span></div>
    </div>
  </section>

  <!-- ===== 詞庫 ===== -->
  <section class="page hidden" id="pg-lib">
    <div class="ptitle">詞庫</div>
    <div class="seg" id="seg">
      <button data-f="word" class="on">單字</button>
      <button data-f="phrase">會話</button>
      <button data-f="saved">已收藏</button>
    </div>
    <div class="legend"><span><i class="st"></i>未學</span><span><i class="st l"></i>學習中</span><span><i class="st m"></i>已熟練</span></div>
    <div class="card list" id="list"></div>
  </section>

  <!-- ===== 練習 ===== -->
  <section class="page hidden" id="pg-prac">
    <div class="ptitle">練習</div>
    <div class="sec" style="margin-top:0">快速練習</div>
    <div class="tiles">
      <button class="card tile" id="qWord"><div class="ico" style="background:var(--flame)">字</div><div><b>單字</b><span>隨機 10 題</span></div></button>
      <button class="card tile" id="qPhrase"><div class="ico" style="background:var(--red)">話</div><div><b>會話</b><span>隨機 10 句</span></div></button>
    </div>
    <div class="sec">複習</div>
    <button class="card prow" id="pSaved">
      <div class="ci" style="color:var(--blue)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg></div>
      <div><b>已收藏的內容</b><span>練習你標記起來的單字與句子</span></div><div class="n" id="nSaved">0</div>
    </button>
    <button class="card prow" id="pMiss">
      <div class="ci" style="color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div><b>錯題本</b><span>曾經按過「忘了」的內容</span></div><div class="n" id="nMiss">0</div>
    </button>
    <button class="card prow" id="pAll">
      <div class="ci" style="color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg></div>
      <div><b>隨機回顧</b><span>從已學過的內容抽 15 張</span></div><div class="n" id="nAll">0</div>
    </button>
    <p style="font-size:12px;color:var(--dim);margin-top:6px">練習模式不會改變複習排程，也不影響連勝。</p>
    <div class="foot"><button id="reset">清除所有進度</button></div>
  </section>

  <!-- ===== 底部導覽 ===== -->
  <nav class="nav" id="nav">
    <button data-p="today" class="on"><span class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></svg></span>今日</button>
    <button data-p="lib"><span class="nb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg></span>詞庫</button>
    <button data-p="prac"><span class="nb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>練習</button>
  </nav>

  <!-- ===== 學習畫面 ===== -->
  <div class="study hidden" id="study">
    <div class="sin" id="sCard">
      <div class="shead">
        <button class="x" id="quit" aria-label="離開"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="prog"><i id="sbar"></i></div>
        <div class="left" id="sleft"></div>
      </div>
      <div class="flash" id="flash">
        <div class="tag" id="tag"></div>
        <div class="ftools">
          <button id="say" aria-label="發音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
          <button id="fbm" class="bm" aria-label="收藏"></button>
        </div>
        <div class="qlabel" id="qlabel"></div>
        <div class="jp" id="fjp"></div>
        <div class="ans hidden" id="ans">
          <div class="kana" id="fkana"></div>
          <div class="zh" id="fzh"></div>
          <div class="fex hidden" id="fex"></div>
        </div>
        <div class="verdict hidden" id="verdict"></div>
      </div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="sin hidden" id="sDone">
      <div class="finish">
        <div class="flame" id="fIcon"></div>
        <div class="num" id="fNum"></div>
        <p id="fSub"></p>
        <h3 id="fTitle">おつかれさま！</h3>
        <p id="fMsg"></p>
      </div>
      <button class="btn" id="back">完成</button>
    </div>
  </div>
  <!-- ===== 單字詳細頁 ===== -->
  <div class="sheet hidden" id="sheet">

const addDays = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); };

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };

function pickNew(type, n){
  const taken = new Set(S.today ? S.today.newIds : []);
  return ALL.filter(id => ITEMS[id].type===type && !S.cards[id] && !taken.has(id)).slice(0,n);
}
function ensureToday(){
  if (!S.today || S.today.date !== td()){
    S.today = {date: td(), newIds: []};
    S.today.newIds = [...pickNew('word', NEW_WORDS), ...pickNew('phrase', NEW_PHRASES)];
    save();
  }
}
const dueIds = () => ALL.filter(id => S.cards[id] && S.cards[id].due <= td());
const newIds = () => S.today.newIds.filter(id => !S.cards[id]);
const currentStreak = () => (S.lastDone === td() || S.lastDone === addDays(td(),-1)) ? S.streak : 0;
const status = id => !S.cards[id] ? '' : S.cards[id].iv >= MASTER_IV ? 'm' : 'l';

/* ================= 間隔重複（簡化 SM-2） ================= */
function nextIv(c, g){
  c = c || {iv:0, ef:2.5, reps:0};
  if (g === 0) return 0;
  if (c.reps === 0) return 1;
  if (c.reps === 1) return g===2 ? 3 : 2;
  return Math.max(c.iv+1, Math.round(c.iv * (g===2 ? c.ef : 1.2)));
}
function grade(id, g){
  const c = S.cards[id] || {iv:0, ef:2.5, reps:0, lapses:0};
  const iv = nextIv(c, g);
  if (g === 0){ c.reps = 0; c.ef = Math.max(1.3, c.ef - 0.2); c.lapses = (c.lapses||0) + 1; }
  else { c.reps++; if (g === 1) c.ef = Math.max(1.3, c.ef - 0.15); }
  c.iv = iv; c.due = addDays(td(), iv);
  S.cards[id] = c; save();
}
const ivLabel = n => n===0 ? '等一下再看' : n===1 ? '明天' : `${n} 天後`;

function markDone(){
  const t = td();
  if (S.lastDone === t) return false;
  S.streak = (S.lastDone === addDays(t,-1)) ? S.streak + 1 : 1;
  S.lastDone = t;
  if (!S.doneDates.includes(t)) S.doneDates.push(t);
  S.doneDates = S.doneDates.slice(-60);
  save(); return true;
}

  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p===p));
  render(); window.scrollTo(0,0);
}
function render(){ if (page==='today') renderToday(); else if (page==='lib') renderLib(); else renderPrac(); }

function renderToday(){
  ensureToday();
  const now = new Date(), wd = '日一二三四五六';
  $('date').textContent = `${now.getMonth()+1}月${now.getDate()}日 星期${wd[now.getDay()]}`;
  const h = now.getHours();
  $('hello').textContent = h<11 ? 'おはよう' : h<18 ? 'こんにちは' : 'こんばんは';
  const st = currentStreak();
  $('streak').textContent = st;
  $('pill').classList.toggle('cold', S.lastDone !== td());

  let w = '';
  for (let i=6;i>=0;i--){
    const d = addDays(td(), -i), on = S.doneDates.includes(d);
    w += `<div class="day"><div class="dot ${on?'on':''} ${i===0&&!on?'today':''}">${on?IC.flameW:''}</div>${i===0?'今天':wd[new Date(d+'T00:00:00').getDay()]}</div>`;
  }
  $('week').innerHTML = w;

  const due = dueIds(), nw = newIds();
  const doneToday = S.lastDone === td(), nothing = due.length + nw.length === 0;
  $('todo').classList.toggle('hidden', nothing && doneToday);
  $('doneBox').classList.toggle('hidden', !(nothing && doneToday));
  $('cRev').textContent = due.length;
  $('cWord').textContent = nw.filter(id=>ITEMS[id].type==='word').length;
  $('cPhrase').textContent = nw.filter(id=>ITEMS[id].type==='phrase').length;
  const mins = Math.max(1, Math.round((due.length*8 + nw.length*15)/60));
  $('taskTitle').textContent = nothing ? '目前沒有排程的內容' : doneToday ? `還有 ${due.length+nw.length} 張可以繼續` : `${due.length+nw.length} 張卡片 · 約 ${mins} 分鐘`;
  $('chips').innerHTML = [...due.map(id=>[id,0]), ...nw.map(id=>[id,1])]
    .map(([id,n]) => `<span class="chip ${n?'new':''}">${ITEMS[id].jp}</span>`).join('');
  $('start').disabled = nothing;
  $('start').textContent = nothing ? '全部學完了' : doneToday ? '繼續' : '開始今日學習';

  const learned = Object.keys(S.cards).length;
  $('sLearn').textContent = learned;
  $('sMaster').textContent = ALL.filter(id => status(id)==='m').length;
  $('sTotal').textContent = ALL.length;
  $('more').classList.toggle('hidden', learned >= ALL.length);
}

function renderLib(){
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.f===libFilter));
  const ids = libFilter==='saved' ? S.saved : ALL.filter(id => ITEMS[id].type===libFilter);
  $('list').innerHTML = ids.length ? ids.map(id => {
    const it = ITEMS[id];
    const sub = it.type==='word' ? `${it.kana ? it.kana+' · ' : ''}${it.zh}` : it.zh;
    return `<div class="row" data-id="${id}"><i class="st ${status(id)}"></i>
      <div class="rmain"><div class="rjp">${it.jp}<button class="spk" data-say="${id}" aria-label="發音">${IC.spk}</button></div><div class="rzh">${sub}</div></div>
      <button class="bm" data-bm="${id}" aria-label="收藏">${isSaved(id)?IC.bmOn:IC.bmOff}</button><span class="chev">›</span></div>`;
  }).join('') : '<div class="empty">還沒有收藏的內容<br>在卡片或列表上點書籤就能加入</div>';
}

/* ================= 單字詳細頁 ================= */
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function markWord(it){   // 例句中標出這個單字（動詞變化時標出詞幹）
  const ex = esc(it.ex);
  for (const k of [it.jp, it.jp.slice(0,-1)]) if (k && ex.includes(k)) return ex.replace(k, `<mark>${k}</mark>`);
  return ex;
}
let detailId = null;
function openDetail(id){
  detailId = id; const it = ITEMS[id], c = S.cards[id];
  $('dJp').textContent = it.jp; $('dJp').classList.toggle('long', it.jp.length > 6);
  $('dKana').textContent = it.kana; $('dKana').classList.toggle('hidden', !it.kana);
  $('dZh').textContent = it.zh;
  $('dExBox').classList.toggle('hidden', !it.ex);
  if (it.ex){ $('dEx').innerHTML = markWord(it); $('dExZh').textContent = it.exZh; }
  $('dBm').innerHTML = isSaved(id) ? IC.bmOn : IC.bmOff;
  $('dSt').textContent = !c ? '還沒學過' : `下次複習：${c.due === td() ? '今天' : c.due}` + (c.lapses ? ` · 答錯過 ${c.lapses} 次` : '');
  $('sheet').classList.remove('hidden');
}
function closeDetail(){ $('sheet').classList.add('hidden'); detailId = null; stopSpeak(); }

const missIds = () => ALL.filter(id => S.cards[id] && S.cards[id].lapses > 0).sort((a,b)=>S.cards[b].lapses-S.cards[a].lapses);
const learnedIds = () => ALL.filter(id => S.cards[id]);
function renderPrac(){
  $('nSaved').textContent = S.saved.length; $('pSaved').disabled = !S.saved.length;
  $('nMiss').textContent = missIds().length; $('pMiss').disabled = !missIds().length;
  $('nAll').textContent = learnedIds().length; $('pAll').disabled = !learnedIds().length;
}

/* ================= 羅馬拼音 → 平假名 ================= */
const RK = {};
(() => {
  const V = 'aiueo';
  const rows = {'':'あいうえお',k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',r:'らりるれろ',
    g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
  for (const c in rows) [...V].forEach((v,i) => RK[c+v] = rows[c][i]);
  Object.assign(RK, {ya:'や',yu:'ゆ',yo:'よ',wa:'わ',wo:'を',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',si:'し',ti:'ち',tu:'つ',hu:'ふ',zi:'じ',
    di:'ぢ',du:'づ',she:'しぇ',je:'じぇ',che:'ちぇ',xtu:'っ',ltu:'っ',xtsu:'っ',
    xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',la:'ぁ',li:'ぃ',lu:'ぅ',le:'ぇ',lo:'ぉ',xya:'ゃ',xyu:'ゅ',xyo:'ょ',lya:'ゃ',lyu:'ゅ',lyo:'ょ'});
  const Y = {ky:'き',gy:'ぎ',sh:'し',sy:'し',j:'じ',jy:'じ',zy:'じ',ch:'ち',cy:'ち',ty:'ち',dy:'ぢ',ny:'に',hy:'ひ',by:'び',py:'ぴ',my:'み',ry:'り'};
  for (const c in Y){ RK[c+'a'] = Y[c]+'ゃ'; RK[c+'u'] = Y[c]+'ゅ'; RK[c+'o'] = Y[c]+'ょ'; }
})();
function toKana(src, final){
  const s = src.toLowerCase(); let out = '', i = 0;
  while (i < s.length){
    const c = s[i], nx = s[i+1];
    if (c === 'n'){
      if (nx === 'n' && /[aiueoy]/.test(s[i+2] || '')){ out += 'ん'; i++; continue; }   // zannen → ざんねん
      if (nx === 'n' || nx === "'"){ out += 'ん'; i += 2; continue; }
      if (nx === undefined){ out += final ? 'ん' : 'n'; i++; continue; }
      if (!/[aiueoy]/.test(nx)){ out += 'ん'; i++; continue; }
    }
    if (/[bcdfghjkmprstvwz]/.test(c) && (nx === c || (c === 't' && nx === 'c'))){ out += 'っ'; i++; continue; }
    let hit = false;
    for (const L of [4,3,2,1]){ const k = s.substr(i, L); if (RK[k]){ out += RK[k]; i += L; hit = true; break; } }
    if (!hit){ out += c === '-' ? 'ー' : src[i]; i++; }
  }
  return out;
}
const toHira = s => s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
const norm = s => toHira(s).replace(/[\s、。，,.．!?！？「」・〜~]/g, '');

/* ================= 學習流程 ================= */
// 佇列項目：{id, step:'learn'|'quiz'}
let Q = [], doneSteps = 0, cur = null, mode = 'daily', newSet = new Set();
let q = null, answered = false, stats = {n:0, ok:0};

function startSession(m, ids){
  mode = m;
  if (m === 'daily'){
    const due = dueIds(), nw = newIds();
    newSet = new Set(nw);
    Q = [...shuffle(due).map(id => ({id, step:'quiz'})), ...nw.map(id => ({id, step:'learn'}))];
  } else { newSet = new Set(); Q = ids.map(id => ({id, step:'quiz'})); }
  if (!Q.length) return;
  doneSteps = 0; stats = {n:0, ok:0};
  $('study').classList.remove('hidden'); $('sCard').classList.remove('hidden'); $('sDone').classList.add('hidden');
  nextCard();
}

function qType(it){
  if (it.type === 'word') return it.kana && Math.random() < .6 ? 'type' : 'meaning';
  return Math.random() < .5 ? 'meaning' : 'reverse';
}
function makeOptions(id, field){
  const it = ITEMS[id], seen = new Set([it[field]]);
  const pool = shuffle(ALL.filter(x => ITEMS[x].type === it.type && x !== id)).filter(x => !seen.has(ITEMS[x][field]) && seen.add(ITEMS[x][field]));
  return shuffle([id, ...pool.slice(0,3)]);
}

function nextCard(){
  if (!Q.length) return finish();
  const step = Q[0]; cur = step.id; answered = false;
  const it = ITEMS[cur], typeTxt = it.type === 'word' ? '單字' : '會話';
  $('sbar').style.width = (doneSteps / (doneSteps + Q.length) * 100) + '%';
  $('sleft').textContent = Q.length;
  $('fbm').innerHTML = isSaved(cur) ? IC.bmOn : IC.bmOff;
  $('verdict').className = 'verdict hidden';
  $('fkana').textContent = it.kana; $('fkana').classList.toggle('hidden', !it.kana);
  $('fzh').textContent = it.zh;
  $('fex').classList.toggle('hidden', !it.ex);
  $('fex').innerHTML = it.ex ? `<div class="exjp">${markWord(it)}</div><div class="exzh">${esc(it.exZh)}</div>` : '';
  setPrompt(it.jp, false);

  if (step.step === 'learn'){
    q = {type:'learn'};
    $('tag').textContent = '新 · ' + typeTxt; $('tag').classList.add('new');
    $('qlabel').textContent = '先記住它，等一下會考';
    $('ans').classList.remove('hidden'); $('say').classList.remove('hidden');
    $('actions').innerHTML = '<button class="btn" id="aNext">記住了</button>';
    speak(cur);
    return;
  }

  q = {type: qType(it)};
  $('tag').textContent = (mode === 'daily' ? (newSet.has(cur) ? '新' : '複習') : '練習') + ' · ' + typeTxt;
  $('tag').classList.toggle('new', mode === 'daily' && newSet.has(cur));
  $('ans').classList.add('hidden');
  $('say').classList.toggle('hidden', q.type !== 'meaning');

  if (q.type === 'type'){
    $('qlabel').textContent = '輸入讀音（羅馬拼音或假名）';
    $('actions').innerHTML = `<input class="inp" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例如：keiken">
      <div class="pv" id="pv"></div>
      <div class="two"><button class="btn2" id="aSkip">不知道</button><button class="btn" id="aCheck">確認</button></div>`;
    const inp = $('inp');
    inp.oninput = () => { const k = toKana(inp.value, false); $('pv').textContent = k && k !== inp.value ? '→ ' + k : ''; };
    inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); e.stopPropagation(); checkTyped(); } };
    setTimeout(() => inp.focus(), 50);
  } else {
    const field = q.type === 'meaning' ? 'zh' : 'jp';
    if (q.type === 'reverse'){ setPrompt(it.zh, true); $('qlabel').textContent = '選出對應的日文'; }
    else $('qlabel').textContent = '選出意思';
    q.opts = makeOptions(cur, field);
    $('actions').innerHTML = `<div class="opts ${q.type === 'reverse' ? 'one' : ''}">` +
      q.opts.map((id, i) => `<button class="opt" data-i="${i}">${ITEMS[id][field]}</button>`).join('') + '</div>';
  }
}
function setPrompt(text, zh){
  const el = $('fjp'); el.textContent = text;
  el.className = zh ? 'zhq' : 'jp' + (text.length > 6 ? ' long' : '');
}

function checkTyped(){
  if (answered) return;
  const it = ITEMS[cur], v = $('inp').value.trim();
  if (!v) return $('inp').focus();
  const ok = norm(toKana(v, true)) === norm(it.kana) || norm(v) === norm(it.jp);
  settle(ok, ok ? '' : `你的答案：${toKana(v, true)}`);
}
function choose(i){
  if (answered) return;
  const ok = q.opts[i] === cur;
  document.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (q.opts[j] === cur) b.classList.add('right'); else if (j === i) b.classList.add('wrong');
  });
  settle(ok, '');
}
function settle(ok, note){
  answered = true; q.ok = ok;
  stats.n++; if (ok) stats.ok++;
  setPrompt(ITEMS[cur].jp, false);
  $('ans').classList.remove('hidden'); $('say').classList.remove('hidden');
  const v = $('verdict');
  v.className = 'verdict ' + (ok ? 'ok' : 'ng');
  v.innerHTML = (ok ? '✓ 答對了' : '✗ 答錯了') + (note ? `<small>${note}</small>` : '');
  if (q.type === 'type') $('actions').innerHTML = '';
  $('actions').insertAdjacentHTML('beforeend', '<button class="btn" id="aNext">繼續</button>');
  speak(cur);
}
function advance(){
  const step = Q.shift(); doneSteps++;
  if (step.step === 'learn'){
    Q.push({id: step.id, step:'quiz'});            // 學完排到後面測驗
  } else {
    if (mode === 'daily') grade(step.id, q.ok ? 2 : 0);
    else if (!q.ok && S.cards[step.id]){ S.cards[step.id].lapses = (S.cards[step.id].lapses || 0) + 1; save(); }
    if (!q.ok) Q.push({id: step.id, step:'quiz'}); // 答錯的稍後再考一次
  }
  nextCard();
}
function finish(){
  $('sCard').classList.add('hidden'); $('sDone').classList.remove('hidden');
  const acc = stats.n ? Math.round(stats.ok / stats.n * 100) : 100;
  if (mode === 'daily'){
    const first = markDone();
    $('fIcon').innerHTML = IC.flame; $('fNum').textContent = S.streak; $('fSub').textContent = '天連勝';
    $('fMsg').textContent = (first ? '今天完成了，連勝 +1' : '又多練了一輪') + ` · 答對率 ${acc}%`;
  } else {
    $('fIcon').innerHTML = IC.check; $('fNum').textContent = ''; $('fSub').textContent = '';
    $('fMsg').textContent = `練習完成 · 答對 ${stats.ok} / ${stats.n} 題`;
  }
}
function closeStudy(){ stopSpeak(); $('study').classList.add('hidden'); render(); }

/* ================= 發音（只用日文語音） ================= */
const hasTTS = 'speechSynthesis' in window;
const audio = new Audio();
let jaVoice = null, toastTimer = null;
function loadVoice(){ if (!hasTTS) return; const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang)); jaVoice = vs.find(v => /Nanami|Kyoko|Google|O-ren|Haruka|Ayumi/.test(v.name)) || vs[0] || null; }
if (hasTTS){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function stopSpeak(){ if (hasTTS) speechSynthesis.cancel(); audio.pause(); }
function speak(id){ if (id) speakText(ITEMS[id].jp); }
// 預先錄好的真人感神經語音：audio/<FNV-1a 雜湊>.mp3（由 gen_audio.py 產生）
function audioKey(text){
  let h = 0x811c9dc5;
  for (const b of new TextEncoder().encode(text)){ h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
let speakTry = 0, speakingText = '';
function speakText(text){
  if (!text) return;
  stopSpeak();
  speakingText = text; speakTry = 0;
  audio.src = `audio/${audioKey(text)}.mp3`;       // 1. 優先：預錄音檔
  audio.play().catch(() => {});                     // 被下一次播放打斷時不提示
}
function speakFallback(text){
  loadVoice();
  if (jaVoice){                                     // 2. 裝置的日文語音
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.voice = jaVoice; u.rate = .9;
    return speechSynthesis.speak(u);
  }
  speakTry = 2;                                     // 3. 線上日文語音，絕不使用中文語音唸漢字
  audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q=' + encodeURIComponent(text);
  audio.play().catch(() => {});
}
audio.onerror = () => {
  if (!audio.src || !speakingText) return;
  if (speakTry === 0){ speakTry = 1; return speakFallback(speakingText); }   // 沒有預錄檔（例如新加的單字）
  toast('無法播放日文發音：請確認網路連線，或在 Windows 設定 → 時間與語言 → 語音 中安裝日文語音');
};
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
}

/* ================= 事件 ================= */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.p));
$('seg').onclick = e => { const b = e.target.closest('button'); if (b){ libFilter = b.dataset.f; renderLib(); } };
$('list').onclick = e => {
  const s = e.target.closest('[data-say]'); if (s) return speak(s.dataset.say);
  const b = e.target.closest('[data-bm]'); if (b){ toggleSave(b.dataset.bm); return renderLib(); }
  const r = e.target.closest('[data-id]'); if (r) openDetail(r.dataset.id);
};
$('dSay').innerHTML = IC.spk; $('dExSay').innerHTML = IC.spk;
$('sbg').onclick = closeDetail;
$('dSay').onclick = () => speak(detailId);
$('dExSay').onclick = () => speakText(ITEMS[detailId].ex);
$('dBm').onclick = () => { toggleSave(detailId); $('dBm').innerHTML = isSaved(detailId) ? IC.bmOn : IC.bmOff; renderLib(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && detailId) closeDetail(); });
$('start').onclick = () => startSession('daily');
$('more').onclick = () => { S.today.newIds.push(...pickNew('word', 3), ...pickNew('phrase', 2)); save(); startSession('daily'); };
$('qWord').onclick = () => startSession('practice', shuffle(ALL.filter(id=>ITEMS[id].type==='word')).slice(0,10));
$('qPhrase').onclick = () => startSession('practice', shuffle(ALL.filter(id=>ITEMS[id].type==='phrase')).slice(0,10));
$('pSaved').onclick = () => startSession('practice', shuffle(S.saved));
$('pMiss').onclick = () => startSession('practice', missIds().slice(0,20));
$('pAll').onclick = () => startSession('practice', shuffle(learnedIds()).slice(0,15));
$('reset').onclick = () => { if (confirm('確定要清除所有進度、收藏與連勝紀錄嗎？')){ S = fresh(); save(); render(); } };

$('actions').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'aNext') advance();
  else if (t.id === 'aCheck') checkTyped();
  else if (t.id === 'aSkip'){ if (!answered){ $('inp').disabled = true; settle(false, '不知道'); } }
  else if (t.dataset.i !== undefined) choose(+t.dataset.i);
};
$('say').onclick = () => speak(cur);
$('fbm').onclick = () => { toggleSave(cur); $('fbm').innerHTML = isSaved(cur) ? IC.bmOn : IC.bmOff; };
$('quit').onclick = closeStudy;
$('back').onclick = closeStudy;
document.addEventListener('keydown', e => {
  if ($('study').classList.contains('hidden') || $('sCard').classList.contains('hidden')) return;
  if (e.target.id === 'inp') return;
  if (e.key === 'Enter' && $('aNext')){ e.preventDefault(); advance(); }
  else if (!answered && q && q.opts && ['1','2','3','4'].includes(e.key) && +e.key <= q.opts.length) choose(+e.key - 1);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('study').classList.contains('hidden')) render(); });

render();
</script>
